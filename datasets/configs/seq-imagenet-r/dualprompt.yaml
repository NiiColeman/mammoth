N_TASKS: 100
N_CLASSES_PER_TASK: 2
N_CLASSES: 200
SIZE: [224, 224]
MEAN: [0, 0, 0]
STD: [1, 1, 1]
TRANSFORM:
    - Resize:
        size: 256
    - RandomResizedCrop:
        size: 224
    - RandomHorizontalFlip
    - ToTensor
    - Normalize:
        mean: [0, 0, 0]
        std: [1, 1, 1]
TEST_TRANSFORM:
    - Resize:
        size: 256
        interpolation: 3
    - CenterCrop:
        size: 224
    - ToTensor
    - Normalize:
        mean: [0, 0, 0]
        std: [1, 1, 1]
batch_size: 64
n_epochs: 15